[project]
name = "synthetic-user-platform"
version = "0.1.0"
description = "Synthetic user platform"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "google-genai",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "rich",
    "sqlalchemy",
    "sqlglot>=30.20.0",
    "streamlit>=1.63.0",
    "tenacity",
    "typer",
]

[project.scripts]
synthetic-user = "synthetic_user.cli:app"

[project.optional-dependencies]
tracing = [
    "langfuse>=4.15.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_user", "mock_product"]
